# docker compose up --build  → the app at http://localhost:${APP_PORT:-8080}, migrated and seeded
# docker compose up -d db    → just Postgres, for running the API/web/tests on your machine

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike
      POSTGRES_DB: bike_repair
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike -d bike_repair"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://bike:bike@db:5432/bike_repair
      SHOP_TIME_ZONE: ${SHOP_TIME_ZONE:-America/Vancouver}
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
